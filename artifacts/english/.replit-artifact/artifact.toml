kind = "web"
previewPath = "/lexo/"
title = "LEXO for English"
version = "1.0.0"
id = "artifacts/english"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/lexo/" ]
localPort = 23567

[services.development]
run = "pnpm --filter @workspace/english run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/english", "run", "build" ]
publicDir = "artifacts/english/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23567"
BASE_PATH = "/lexo/"
