kind = "web"
previewPath = "/lexo/flashcards/"
title = "LEXO Flashcards"
version = "1.0.0"
id = "artifacts/lexo-flashcards"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/lexo/flashcards/" ]
localPort = 26120

[services.development]
run = "pnpm --filter @workspace/lexo-flashcards run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lexo-flashcards", "run", "build" ]
publicDir = "artifacts/lexo-flashcards/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26120"
BASE_PATH = "/lexo/flashcards/"
