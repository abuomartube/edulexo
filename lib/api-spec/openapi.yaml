openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: cards
    description: LEXO Flashcard operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Register a new student account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out the current user
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Current user (or null when not authenticated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Update the current user's profile (name, phone, bio, avatar)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the current user's password (requires current password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/{userId}/profile:
    get:
      operationId: getPublicProfile
      tags: [auth]
      summary: Get a user's public profile (avatar, name, bio, certificates)
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Public profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: If the email matches an account, a reset link has been sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password using a token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /auth/send-verification:
    post:
      operationId: sendVerificationEmail
      tags: [auth]
      summary: Send (or re-send) the email verification link to the current user
      responses:
        "200":
          description: Verification email queued (or no-op if already verified)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Confirm an email-verification token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /levels:
    get:
      operationId: listLevels
      tags: [cards]
      summary: List CEFR levels with counts
      responses:
        "200":
          description: Levels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LevelSummary"
  /words:
    get:
      operationId: listWords
      tags: [cards]
      summary: List words, optionally filtered by level
      parameters:
        - in: query
          name: level
          required: false
          schema:
            type: string
            enum: [A1, A2, B1, B2, C1, ALL]
        - in: query
          name: search
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Word list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WordListItem"
  /cards/{id}:
    get:
      operationId: getCard
      tags: [cards]
      summary: Get a flashcard with full details (translation + sentence)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Card detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /audio/{hash}.mp3:
    get:
      operationId: getAudio
      tags: [cards]
      summary: Stream synthesized MP3 audio for a card hash
      parameters:
        - in: path
          name: hash
          required: true
          schema:
            type: string
            pattern: "^[a-f0-9]{64}$"
      responses:
        "200":
          description: Audio stream
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid audio id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Audio not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Not authorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    PublicUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum: [student, admin]
        emailVerified:
          type: boolean
        avatarUrl:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        preferredLanguage:
          type: string
          enum: [en, ar]
        notifyExpiry:
          type: boolean
        notifyMarketing:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - role
        - emailVerified
        - preferredLanguage
        - notifyExpiry
        - notifyMarketing
        - createdAt
    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"
      required:
        - user
    MeResponse:
      type: object
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/PublicUser"
            - type: "null"
      required:
        - user
    SignupRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
        phone:
          type: string
          maxLength: 32
        password:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - name
        - email
        - password
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
        - email
        - password
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 8
        password:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - token
        - password
    VerifyEmailRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 8
      required:
        - token

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          maxLength: 32
          nullable: true
        bio:
          type: string
          maxLength: 500
          nullable: true
        avatarObjectPath:
          type: string
          description: |
            Object path returned from POST /storage/uploads/request-url after
            the client uploaded a new avatar image. Server normalizes and
            sets the avatar ACL, then stores the resulting public URL.
          nullable: true
        preferredLanguage:
          type: string
          enum: [en, ar]
        notifyExpiry:
          type: boolean
        notifyMarketing:
          type: boolean

    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - currentPassword
        - newPassword

    PublicProfileResponse:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/PublicProfile"
      required:
        - profile

    PublicProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        avatarUrl:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        memberSince:
          type: string
          format: date-time
        certificates:
          type: array
          items:
            $ref: "#/components/schemas/PublicProfileCertificate"
      required:
        - id
        - name
        - memberSince
        - certificates

    PublicProfileCertificate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        course:
          type: string
          enum: [intro, english]
        tier:
          type: string
        certificateId:
          type: string
        completionDate:
          type: string
        issuedAt:
          type: string
          format: date-time
      required:
        - id
        - course
        - tier
        - certificateId
        - completionDate
        - issuedAt

    LevelSummary:
      type: object
      properties:
        level:
          type: string
        count:
          type: integer
      required: [level, count]
    WordListItem:
      type: object
      properties:
        id:
          type: integer
        english:
          type: string
        pos:
          type: string
        level:
          type: string
      required: [id, english, pos, level]
    Card:
      type: object
      properties:
        id:
          type: integer
        level:
          type: string
        english:
          type: string
        pos:
          type: string
        arabic:
          type: string
        sentenceEn:
          type: string
        sentenceAr:
          type: string
        audioWordUrl:
          type: string
        audioSentenceUrl:
          type: string
      required:
        - id
        - level
        - english
        - pos
        - arabic
        - sentenceEn
        - sentenceAr
        - audioWordUrl
        - audioSentenceUrl
